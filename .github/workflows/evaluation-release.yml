name: Fork evaluation native package

on:
  push:
    branches: [patch/evaluation-fabric-release]
  workflow_dispatch:
    inputs:
      evaluation_branch:
        description: Exact evaluation branch (patch/evaluation-fabric-release)
        required: true
        type: string
      source_sha:
        description: Exact 40-hex evaluation source commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  EVALUATION_BRANCH: patch/evaluation-fabric-release

concurrency:
  group: vonk-evaluation-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  authority:
    name: Bind fork evaluation source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      semantic_version: ${{ steps.metadata.outputs.semantic_version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      build_digest: ${{ steps.metadata.outputs.build_digest }}
      arm64_package: ${{ steps.metadata.outputs.arm64_package }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      compiled_artifact_name: ${{ steps.metadata.outputs.compiled_artifact_name }}
    steps:
      - name: Check out selected evaluation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require fork evaluation ref and committed installer key
        shell: bash
        env:
          DISPATCH_BRANCH: ${{ inputs.evaluation_branch }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kelchm/vonk-forge
          test "$GITHUB_REF_TYPE" = branch
          [[ "$GITHUB_REF" == refs/heads/patch/evaluation-* ]]
          test "$GITHUB_REF" = "refs/heads/$EVALUATION_BRANCH"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$(git rev-parse --verify 'HEAD^{commit}')"
          case "$GITHUB_EVENT_NAME" in
            push) test -z "${DISPATCH_BRANCH:-}${DISPATCH_SOURCE_SHA:-}" ;;
            workflow_dispatch)
              # Manual runs must name the evaluation branch and the full source
              # commit explicitly; both must equal what this run checked out.
              test "$DISPATCH_BRANCH" = "$EVALUATION_BRANCH"
              [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$DISPATCH_SOURCE_SHA" = "$GITHUB_SHA"
              ;;
            *) exit 64 ;;
          esac
          test -z "$(git status --porcelain=v1)"
          test -f install/installer-release-public.pem
          test ! -L install/installer-release-public.pem
          git cat-file -e HEAD:install/installer-release-public.pem
          test "$(git hash-object install/installer-release-public.pem)" = \
            "$(git rev-parse HEAD:install/installer-release-public.pem)"
          grep -F -- '-----BEGIN PUBLIC KEY-----' install/installer-release-public.pem
          if grep -E -- 'BEGIN (PRIVATE|RSA PRIVATE) KEY' \
            install/installer-release-public.pem; then
            echo "installer public key file contains private key material" >&2
            exit 64
          fi

      - name: Derive evaluation package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(
            scripts/evaluation-build-release metadata \
              --source-sha "$GITHUB_SHA" \
              --cargo-lock Cargo.lock
          )
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          version=$(printf '%s\n' "$metadata" | sed -n 's/^version=//p')
          semantic=$(printf '%s\n' "$metadata" | sed -n 's/^semantic_version=//p')
          test "$version" = "${semantic}~dev.555+g${GITHUB_SHA:0:12}"

  compile:
    name: Compile ARM64 evaluation binaries
    needs: [authority]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out exact evaluation compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact selected compilation source
        shell: bash
        env:
          DISPATCH_BRANCH: ${{ inputs.evaluation_branch }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kelchm/vonk-forge
          test "$GITHUB_REF_TYPE" = branch
          [[ "$GITHUB_REF" == refs/heads/patch/evaluation-* ]]
          test "$GITHUB_REF" = "refs/heads/$EVALUATION_BRANCH"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push) test -z "${DISPATCH_BRANCH:-}${DISPATCH_SOURCE_SHA:-}" ;;
            workflow_dispatch)
              test "$DISPATCH_BRANCH" = "$EVALUATION_BRANCH"
              [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$DISPATCH_SOURCE_SHA" = "$SOURCE_SHA"
              ;;
            *) exit 64 ;;
          esac
          test "$SOURCE_SHA" = "$(git rev-parse --verify 'HEAD^{commit}')"
          test -z "$(git status --porcelain=v1)"
          git cat-file -e HEAD:install/installer-release-public.pem
          test "$(git hash-object install/installer-release-public.pem)" = \
            "$(git rev-parse HEAD:install/installer-release-public.pem)"

      - name: Recompute evaluation metadata and v2 build digest
        shell: bash
        env:
          ARM64_PACKAGE: ${{ needs.authority.outputs.arm64_package }}
          ARTIFACT_NAME: ${{ needs.authority.outputs.artifact_name }}
          BUILD_DIGEST: ${{ needs.authority.outputs.build_digest }}
          COMPILED_ARTIFACT_NAME: ${{ needs.authority.outputs.compiled_artifact_name }}
          SEMANTIC_VERSION: ${{ needs.authority.outputs.semantic_version }}
          VERSION: ${{ needs.authority.outputs.version }}
        run: |
          set -euo pipefail
          expected=$(
            scripts/evaluation-build-release metadata \
              --source-sha "$GITHUB_SHA" \
              --cargo-lock Cargo.lock
          )
          actual=$(printf '%s\n' \
            "version=$VERSION" \
            "semantic_version=$SEMANTIC_VERSION" \
            "sequence=555" \
            "source_sha=$GITHUB_SHA" \
            "source_repository=https://github.com/kelchm/vonk-forge" \
            "github_repository=kelchm/vonk-forge" \
            "architecture=linux-arm64" \
            "target=aarch64-unknown-linux-gnu" \
            "debian_architecture=arm64" \
            "build_digest=$BUILD_DIGEST" \
            "arm64_package=$ARM64_PACKAGE" \
            "artifact_name=$ARTIFACT_NAME" \
            "compiled_artifact_name=$COMPILED_ARTIFACT_NAME")
          test "$actual" = "$expected"
          lock_digest=$(sha256sum Cargo.lock | cut -d' ' -f1)
          bash_digest="sha256:$(
            printf 'vonk-agent-build-v2\0%s\0%s\0%s' \
              "$GITHUB_SHA" linux-arm64 "$lock_digest" \
              | sha256sum | cut -d' ' -f1
          )"
          test "$bash_digest" = "$BUILD_DIGEST"
          test "$(uname -m)" = aarch64

      - name: Install pinned native Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          rustup target add aarch64-unknown-linux-gnu

      - name: Restore architecture Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64-evaluation
          add-job-id-key: "false"
          cache-workspace-crates: "false"

      - name: Compile exact evaluation binary set
        shell: bash
        env:
          BUILD_DIGEST: ${{ needs.authority.outputs.build_digest }}
          SEMANTIC_VERSION: ${{ needs.authority.outputs.semantic_version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          export CARGO_INCREMENTAL=0 SOURCE_DATE_EPOCH="$epoch"
          export VONK_AGENT_BUILD_DIGEST="$BUILD_DIGEST"
          export VONK_AGENT_SEMANTIC_VERSION="$SEMANTIC_VERSION"
          target=aarch64-unknown-linux-gnu
          staged="$RUNNER_TEMP/compiled"
          cargo build --release --locked --target "$target" \
            --package vonk-agent --package vonk-agent-helper
          RUSTFLAGS='-C target-feature=+crt-static' \
            cargo build --release --locked --target "$target" \
              --package vonk-build-egress
          cargo build --release --locked --target "$target" \
            --package vonk-spark-setup --package vonk-nas-setup
          install -d -m 0755 "$staged/binaries" "$staged/tools" "$staged/setup"
          install -m 0555 \
            "target/$target/release/vonk-agent" \
            "target/$target/release/vonk-agent-helper" \
            "target/$target/release/vonk-build-egress" \
            "target/$target/release/vonk-runtime-probe" \
            "$staged/binaries/"
          scripts/verify-agent-binaries \
            --architecture linux-arm64 \
            --semantic-version "$SEMANTIC_VERSION" \
            --build-digest "$BUILD_DIGEST" \
            --binaries-dir "$staged/binaries" \
            > "$staged/binaries.json"
          scripts/materialize-agent-tools --output-root target
          install -m 0555 "target/$target/release/oras" "$staged/tools/oras"
          install -m 0444 "target/$target/release/oras.LICENSE" \
            "$staged/tools/oras.LICENSE"
          install -m 0555 \
            "target/$target/release/vonk-nas-setup" \
            "target/$target/release/vonk-spark-setup" \
            "$staged/setup/"
          (
            cd "$staged/setup"
            sha256sum -- vonk-nas-setup vonk-spark-setup | LC_ALL=C sort > SHA256SUMS
          )

      - name: Revalidate source before compiled artifact upload
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse --verify 'HEAD^{commit}')"
          test -z "$(git status --porcelain=v1)"

      - name: Upload exact compiled binary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.authority.outputs.compiled_artifact_name }}
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          path: |
            ${{ runner.temp }}/compiled/binaries.json
            ${{ runner.temp }}/compiled/binaries/vonk-agent
            ${{ runner.temp }}/compiled/binaries/vonk-agent-helper
            ${{ runner.temp }}/compiled/binaries/vonk-build-egress
            ${{ runner.temp }}/compiled/binaries/vonk-runtime-probe
            ${{ runner.temp }}/compiled/tools/oras
            ${{ runner.temp }}/compiled/tools/oras.LICENSE
            ${{ runner.temp }}/compiled/setup/vonk-nas-setup
            ${{ runner.temp }}/compiled/setup/vonk-spark-setup
            ${{ runner.temp }}/compiled/setup/SHA256SUMS

  sign:
    name: Sign ARM64 evaluation package
    needs: [authority, compile]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: evaluation-release
    permissions:
      contents: read
    steps:
      - name: Check out exact evaluation packaging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact selected packaging source
        shell: bash
        env:
          DISPATCH_BRANCH: ${{ inputs.evaluation_branch }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kelchm/vonk-forge
          test "$GITHUB_REF_TYPE" = branch
          [[ "$GITHUB_REF" == refs/heads/patch/evaluation-* ]]
          test "$GITHUB_REF" = "refs/heads/$EVALUATION_BRANCH"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push) test -z "${DISPATCH_BRANCH:-}${DISPATCH_SOURCE_SHA:-}" ;;
            workflow_dispatch)
              test "$DISPATCH_BRANCH" = "$EVALUATION_BRANCH"
              [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$DISPATCH_SOURCE_SHA" = "$SOURCE_SHA"
              ;;
            *) exit 64 ;;
          esac
          test "$SOURCE_SHA" = "$(git rev-parse --verify 'HEAD^{commit}')"
          test -z "$(git status --porcelain=v1)"
          git cat-file -e HEAD:install/installer-release-public.pem
          test "$(git hash-object install/installer-release-public.pem)" = \
            "$(git rev-parse HEAD:install/installer-release-public.pem)"

      - name: Download exact compiled binary evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authority.outputs.compiled_artifact_name }}
          path: prebuilt

      - name: Validate compiled evidence and rebuild v2 digest
        shell: bash
        env:
          BUILD_DIGEST: ${{ needs.authority.outputs.build_digest }}
          SEMANTIC_VERSION: ${{ needs.authority.outputs.semantic_version }}
          VERSION: ${{ needs.authority.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          expected=$(
            scripts/evaluation-build-release metadata \
              --source-sha "$GITHUB_SHA" \
              --cargo-lock Cargo.lock
          )
          test "$(printf '%s\n' "$expected" | sed -n 's/^version=//p')" = "$VERSION"
          test "$(printf '%s\n' "$expected" | sed -n 's/^build_digest=//p')" = \
            "$BUILD_DIGEST"
          expected_files=$(printf '%s\n' \
            prebuilt/binaries.json \
            prebuilt/binaries/vonk-agent \
            prebuilt/binaries/vonk-agent-helper \
            prebuilt/binaries/vonk-build-egress \
            prebuilt/binaries/vonk-runtime-probe \
            prebuilt/setup/SHA256SUMS \
            prebuilt/setup/vonk-nas-setup \
            prebuilt/setup/vonk-spark-setup \
            prebuilt/tools/oras \
            prebuilt/tools/oras.LICENSE)
          actual_files=$(find prebuilt -type f -print | LC_ALL=C sort)
          test "$actual_files" = "$expected_files"
          test -z "$(find prebuilt -type l -print -quit)"
          test -z "$(find prebuilt ! -type d ! -type f ! -type l -print -quit)"
          lock_digest=$(sha256sum Cargo.lock | cut -d' ' -f1)
          bash_digest="sha256:$(
            printf 'vonk-agent-build-v2\0%s\0%s\0%s' \
              "$GITHUB_SHA" linux-arm64 "$lock_digest" \
              | sha256sum | cut -d' ' -f1
          )"
          test "$bash_digest" = "$BUILD_DIGEST"
          scripts/verify-agent-binaries \
            --architecture linux-arm64 \
            --semantic-version "$SEMANTIC_VERSION" \
            --build-digest "$BUILD_DIGEST" \
            --binaries-dir prebuilt/binaries \
            > "$RUNNER_TEMP/binaries.json"
          cmp --silent prebuilt/binaries.json "$RUNNER_TEMP/binaries.json"
          (cd prebuilt/setup && sha256sum -c SHA256SUMS)
          scripts/materialize-agent-tools --output-root target
          cmp --silent prebuilt/tools/oras target/aarch64-unknown-linux-gnu/release/oras
          cmp --silent prebuilt/tools/oras.LICENSE target/aarch64-unknown-linux-gnu/release/oras.LICENSE
          install -d -m 0755 "$RUNNER_TEMP/package-binaries"
          install -m 0555 \
            prebuilt/binaries/vonk-agent \
            prebuilt/binaries/vonk-agent-helper \
            prebuilt/binaries/vonk-build-egress \
            prebuilt/binaries/vonk-runtime-probe \
            prebuilt/tools/oras \
            "$RUNNER_TEMP/package-binaries/"
          install -m 0444 prebuilt/tools/oras.LICENSE \
            "$RUNNER_TEMP/package-binaries/oras.LICENSE"

      - name: Materialize and verify evaluation signing key
        shell: bash
        env:
          VONK_EVALUATION_AGENT_KEY_SHA256: ${{ vars.VONK_EVALUATION_AGENT_KEY_SHA256 }}
          VONK_EVALUATION_AGENT_PRIVATE_KEY: ${{ secrets.VONK_EVALUATION_AGENT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VONK_EVALUATION_AGENT_PRIVATE_KEY"
          [[ "$VONK_EVALUATION_AGENT_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          key_path="$RUNNER_TEMP/vonk-evaluation-agent.pem"
          cleanup() { rm -f "$key_path"; }
          trap cleanup EXIT INT TERM
          install -m 0600 /dev/null "$key_path"
          printf '%s' "$VONK_EVALUATION_AGENT_PRIVATE_KEY" > "$key_path"
          scripts/evaluation-build-release verify-key \
            --private-key "$key_path" \
            --expected "$VONK_EVALUATION_AGENT_KEY_SHA256"
          trap - EXIT INT TERM

      - name: Build signed evaluation package
        shell: bash
        env:
          BUILD_DIGEST: ${{ needs.authority.outputs.build_digest }}
          VERSION: ${{ needs.authority.outputs.version }}
          VONK_SOURCE_REPOSITORY: https://github.com/kelchm/vonk-forge
          VONK_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/vonk-evaluation-agent.pem"
          cleanup() { rm -f "$key_path"; }
          trap cleanup EXIT INT TERM
          test -f "$key_path"
          test "$(stat -c %a "$key_path")" = 600
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          scripts/build-agent-deb \
            --version "$VERSION" \
            --architecture linux-arm64 \
            --build-digest "$BUILD_DIGEST" \
            --release-private-key "$key_path" \
            --binaries-dir "$RUNNER_TEMP/package-binaries" \
            --source-date-epoch "$epoch" \
            --output-dir dist
          scripts/verify-agent-deb --json \
            "dist/vonk-forge-agent_${VERSION}_arm64.deb"
          rm -f "$key_path"
          test ! -e "$key_path"
          trap - EXIT INT TERM

      - name: Remove evaluation signing key
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/vonk-evaluation-agent.pem"
          test ! -e "$RUNNER_TEMP/vonk-evaluation-agent.pem"

      - name: Upload exact public evaluation output set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.authority.outputs.artifact_name }}
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          path: |
            dist/vonk-forge-agent_${{ needs.authority.outputs.version }}_arm64.deb
            dist/vonk-forge-agent_${{ needs.authority.outputs.version }}_arm64.deb.sha256
            dist/vonk-forge-agent_${{ needs.authority.outputs.version }}_arm64.deb.host.sig
            dist/vonk-forge-agent_${{ needs.authority.outputs.version }}_arm64.sbom.cdx.json
            dist/vonk-forge-agent_${{ needs.authority.outputs.version }}_arm64.sbom.spdx.json
            dist/vonk-forge-agent_${{ needs.authority.outputs.version }}_arm64.provenance.json
            prebuilt/setup/vonk-nas-setup
            prebuilt/setup/vonk-spark-setup
            prebuilt/setup/SHA256SUMS
